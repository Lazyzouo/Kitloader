name: Official Release / 官方发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kitloader-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish official packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build official language packages
        run: ./gradlew clean build --no-daemon --console=plain
      - name: Verify release assets
        shell: bash
        run: |
          version="$(./gradlew -q properties --no-daemon | awk '/^version:/ {print $2}')"
          test -f "build/libs/Kitloader-$version-en.us.jar"
          test -f "build/libs/Kitloader-$version-zh.cn.jar"
          test "$(find build/libs -maxdepth 1 -type f -name '*.jar' | wc -l | tr -d ' ')" = "2"
      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(./gradlew -q properties --no-daemon | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: Detect new version tag
        id: tag
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.value }}" >/dev/null; then
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare bilingual release notes
        if: steps.tag.outputs.new_release == 'true'
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          sed "s/{{VERSION}}/$version/g" .github/release-notes.md > .github/release-notes.generated.md
          printf '\n### Changelog / 更新日志\n\n' >> .github/release-notes.generated.md
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1 }
            capture && $0 ~ "^## \\[" && $0 !~ "^## \\[" version "\\]" { exit }
            capture { print }
          ' CHANGELOG.md >> .github/release-notes.generated.md
      - name: Publish GitHub Release
        if: steps.tag.outputs.new_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Kitloader v${{ steps.version.outputs.value }}
          body_path: .github/release-notes.generated.md
          generate_release_notes: false
          files: |
            build/libs/Kitloader-${{ steps.version.outputs.value }}-en.us.jar
            build/libs/Kitloader-${{ steps.version.outputs.value }}-zh.cn.jar
