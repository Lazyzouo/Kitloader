plugins {
    id 'java'
}

group = 'com.lazyz'
version = '2.0.17'
def pluginAuthor = 'Lazyz'
def paperApi = 'io.papermc.paper:paper-api:26.2.build.91-stable'

repositories {
    mavenCentral()
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
}

dependencies {
    compileOnly paperApi
    testImplementation paperApi
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

sourceSets {
    main {
        resources {
            exclude 'config.yml'
            exclude 'main.zip'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    def props = [
            version: version,
            project_name: project.name,
            group: project.group,
            author: pluginAuthor
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.named('jar') {
    archiveFileName.set("Kitloader-${project.version}-zh.cn.jar")
    exclude 'config.yml'
    from('presets/config.zh_CN.yml') {
        rename { 'config.yml' }
        expand(version: version, author: pluginAuthor)
    }
}

tasks.register('englishJar', Jar) {
    dependsOn classes
    archiveFileName.set("Kitloader-${project.version}-en.us.jar")
    from(sourceSets.main.output) {
        exclude 'config.yml'
    }
    from('presets/config.en_US.yml') {
        rename { 'config.yml' }
        expand(version: version, author: pluginAuthor)
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('englishJar')
}
