  # 深紫罗兰贵族渐变 + 粗体（个人 Kit 列表界面标题）
  kit-list-title: "&#8A2387&l个&#962B85&l人&#A23282&lK&#AE3A80&li&#BA417D&lt&#C6497B&l列&#D25078&l表"
  # 鲜血红流光渐变 + 粗体（编辑 Kit 界面前缀）
  kit-edit-prefix: "&#D31027&l编&#DD1827&l辑&#E62028&lK&#F02828&li&#FF372A&lt &8&l» &f&l"

  # ---- 独立功能UI标题配置 ----
  titles:
     custom-supply: "&#FF0099&l自&#FF1188&l定&#FF2277&l义&#FF3366&l补&#FF4455&l给&#FF5544&l盒"
     enchant-edit: "&#8E2DE2&l附&#8020DF&l魔&#7213DC&l与&#6406D9&l物&#5600D6&l品&#4A00E0&l编&#3D00EB&l辑"
     armor-trim: "&#000046&l盔&#071D43&l甲&#0F3941&l纹&#16563E&l饰&#1D733B&l与&#248F39&l名&#2CB036&l称"
     uploaded-supplies: "&#F12711&l已&#F34217&l上&#F45E1E&l传&#F67924&l的&#F8952B&l补&#F9B031&l给"
     dedicated-enderchest: "&#D32F2F&l专&#D73F46&l属&#DB4548&l末&#DF4C4A&l影&#E3524C&l箱"
    # {page} 变量代表页码
     supply-enderchest-mode: "&#D32F2F&l末&#D73F46&l影&#DB4548&l箱&#DF4C4A&l直&#E3524C&l存&#E7594F&l模&#EB5F51&l式 &8&l- P{page}"
    # {player} 代表玩家名, {kit} 代表套装名
     admin-other-kit: "&#FF0099&l管&#FF0E9B&l理&#FF1C9D&l他&#FF2A9F&l人&#FF38A1&lK&#FF46A3&li&#FF54A5&lt&#FF62A7&l: &f&l{player} &#808080&l- &e&l{kit}"

  # ---- 界面按键与Lore配置 ----
  # GUI 界面翻页：上一页按钮显示文本
  btn-prev-page: "&#00B09B&l⬅ 上一页"
  # GUI 界面翻页：下一页按钮显示文本
  btn-next-page: "&#00B09B&l下一页 ➡"
  # GUI 界面当前分类显示格式
  btn-category-name: "&#F2C94C&l[*] 分类: &f&l{category}"

  # 删除确认按钮显示文本
  btn-confirm-delete: "&#00B09B&l[✔] 确认删除"
  # 删除确认按钮的 Lore 提示说明
  btn-confirm-lore: "&#95A5A6&l点击永久删除该Kit，不可恢复！"
  # 取消删除操作按钮显示文本
  btn-cancel-delete: "&#FF5E62&l[✖] 取消操作"
  # 取消操作按钮的 Lore 提示说明
  btn-cancel-lore: "&#95A5A6&l点击返回Kit列表。"

  # 功能按键名称配置
  buttons:
    custom-supply: "&#F2C94C&l[+] 自定义上传补给"
    uploaded-supplies: "&#F2C94C&l[=] 查看已上传补给"
    enderchest-mode: "&#D32F2F&l[>] 快捷末影箱 (直存模式)"
    # 使用 | 符号可配置多行 Lore
  enderchest-mode-lore: |
    &#95A5A6&l点击切换为末影箱直存模式
    &#95A5A6&l配置超9格时自动转移全新大UI
    &#95A5A6&l方便将补给盒直接存入其中

  # 正常状态下 Kit 物品的 Lore 提示信息
  kit-item-lore:
    - "&7"
    - "&#00B09B&l[左键] &f&l加载该Kit"
    - "&#FF5E62&l[右键] &f&l编辑 / 删除"

  # 受限制世界中 Kit 物品的 Lore 提示信息
  kit-item-lore-restricted:
    - "&7"
    - "&#00B09B&l[左键] &f&l仅限加载该Kit"
    - "&#F2C94C&l[右键] &f&l查看Kit内容 (当前世界只读)"

