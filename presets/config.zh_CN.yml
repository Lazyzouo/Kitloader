# ============================================================================ #
#                                                                              #
#                                Kitloader v${version}                         #
#                                                                              #
#    作者: ${author}                                                           #
#    描述: 专为 Folia/Paper 设计的高性能Kitloader管理系统                      #
#    提示: 修改本文件后，可在游戏内使用 /kitloader reload 指令热重载所有配置。       #
#                                                                              #
# ============================================================================ #

# 发行包默认语言：zh_CN 或 en_US
language: zh_CN

# GitHub 官方 Release 自动更新
updates:
  enabled: true
  auto-download: true

settings:
  # 玩家退出游戏时是否重置状态/数据 用于防止玩家上而已重连ReKit 设为False则不重置
  reset-on-quit: false
  # 玩家能够保存的最大个人 Kit 数量上限
  max-kits: 9

  custom-supply:
    # 是否启用自定义上传补给功能
    enabled: true
    # 自定义补给分类的上传最大数量限制
    max-limit: 3
    # 默认新创建的自定义补给盒名称
    default-box-name: "&#34495E&l潜影盒"

  public-kits:
    # 是否允许玩家上传共享 Kit（不影响查看和管理已上传的 Kit）
    upload-enabled: true
    # 每名玩家最多可上传的共享 Kit 数量
    max-limit: 2

  # 默认的 KitLoader 分类名称
  default-category: "supply"
  # 管理员指令及操作的权限节点
  admin-permission: "kitloader.admin"

  # 单次使用的特殊世界列表（在这些世界中 Kit 的使用会受到次数限制）
  single-use-worlds: []

  # 共用白名单：绕过区域限制，同时授权使用 /regear；/inv 还要求执行者为 OP
  # 支持玩家名或 UUID，不区分大小写
  bypass-whitelist: []

  autosave:
    # 是否启用背包自动保存/备份功能
    enabled: true
    # 触发自动保存所需的最低背包填满格子数
    required-filled-slots: 36

  shulker-limits:
    # 是否启用潜影盒数量限制功能
    enabled: true
    # 单个 Kit 保存时允许的最大潜影盒数量；/kitloader invmax 会与 inventory-max 同步修改
    kit-save-max: 3
    # 玩家背包中允许存在的最大潜影盒数量（默认环境）；可使用 /kitloader invmax <1-36> 修改
    inventory-max: 3
    # 在这些世界中，玩家背包潜影盒上限将自动与 enderchest-max 保持一致！
    special-limit-worlds: []
    # 末影箱中允许存在的最大潜影盒数量
    # 提示：该数值同时决定专属末影箱 UI，以及“已上传的补给”页面末影箱区域的开放格数
    # 已上传补给页会按 1-9 / 10-18 / 19-27 自动显示 9 / 18 / 27 格末影箱区域
    # 如果这个值大于 9，将会自动切换为大屏(最大54格)末影箱UI模式
    enderchest-max: 9
    # 拾取超限时的提示消息防刷屏冷却时间（毫秒）
    warning-cooldown: 3000

  gui-animation:
    # GUI界面（如分类箱的彩色滚动标题、动态潜影盒变色）的刷新间隔（毫秒）
    # 默认 100 毫秒，数值越低动画越丝滑，但会轻微增加服务器发包负担
    update-interval: 100

  naming:
    # 控制玩家取消重命名操作的指令（防止与其他插件冲突时可修改）
    cancel-command: "/kitloader cancelname"

  enchantments:
    # 附魔不支持或发生冲突时，消息与拒绝音效的防刷屏冷却（毫秒）
    rejection-cooldown-ms: 1500

gui:
  # ---- 界面全局标题配置 ----
  # 高级深色极光蓝渐变 + 粗体（分类箱界面标题前缀）
  category-prefix: "&#0F2027&l分&#1A2A32&l类&#203A43&l箱 &8&l» &f&l"
  # 熔岩烈焰红渐变 + 粗体（保存并关闭按钮前缀）
